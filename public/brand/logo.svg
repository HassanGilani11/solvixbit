<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 60" width="100%" height="100%" fill="none">
  <!-- Minimalist Geometric Emblem (S + Digital Node) -->
  <g transform="translate(4, 8)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#000000" />
    <path d="M 12 16 L 28 16 C 32 16 34 18 34 21 C 34 24 31 25 26 25 L 18 25 C 13 25 10 27 10 30 C 10 33 12 35 17 35 L 32 35" 
          stroke="#598BFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="32" cy="35" r="3" fill="#02C415" />
    <circle cx="12" cy="16" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Typography: SOLVIXBIT -->
  <text x="60" y="34" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5" fill="#000000">
    SOLVIX<tspan fill="#598BFF">BIT</tspan>
  </text>
  
  <!-- Tagline: TECHNOLOGY THAT SOLVES. -->
  <text x="61" y="47" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="7.5" letter-spacing="2" fill="#6B7280" text-transform="uppercase">
    Technology That Solves.
  </text>
</svg>
